<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | MarkxCollections</title>
<meta name="description" content="Review your cart, choose Cash on Delivery or Card Payment, and proceed to checkout.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-nav="shop">

<div id="site-header"></div>

<div class="page-head">
  <div class="container">
    <span class="eyebrow">YOUR BAG</span>
    <h1 style="font-size:2.4rem;">Your Cart</h1>
    <div class="crumbs"><a href="index.html">Home</a> / Cart</div>
  </div>
</div>

<main class="section">
  <div class="container">
    <div class="empty-state" id="cartEmpty" style="display:none;">
      <i class="fa-solid fa-bag-shopping"></i>
      <h2>Your Cart Is Empty</h2>
      <p>Looks like you haven't added anything yet.</p>
      <a href="shop.html" class="btn btn-accent">Start Shopping</a>
    </div>

    <div class="checkout-grid">
      <div id="cartList"></div>

      <aside class="cart-side" id="cartSide">
        <h3 style="text-transform:none;font-family:var(--font-body);font-size:1.1rem;margin-bottom:18px;">Order Summary</h3>
        <div class="sum-row"><span>Subtotal</span><span id="sumSubtotal">Rs. 0</span></div>
        <div class="sum-row discount" id="sumDiscountRow" style="display:none;"><span>Card Discount</span><span id="sumDiscount">Rs. 0</span></div>
        <div class="sum-row"><span>Delivery</span><span id="sumDelivery">Rs. 0</span></div>
        <div class="sum-row total"><span>Total</span><span id="sumTotal">Rs. 0</span></div>

        <div style="margin-top:22px;">
          <h4 style="font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">Payment Method</h4>
          <label class="radio-card selected">
            <input type="radio" name="cartPayment" value="cod" checked>
            <span><strong>Cash on Delivery</strong><span class="small">Pay when your order arrives</span></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="cartPayment" value="card">
            <span><strong>Card Payment — Get 15% OFF</strong><span class="small">Discount applied automatically</span></span>
          </label>
        </div>

        <button class="btn btn-accent btn-block" id="proceedCheckoutBtn" style="margin-top:20px;">Proceed To Checkout</button>
      </aside>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
