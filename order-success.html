<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed | MarkxCollections</title>
<meta name="description" content="Your MarkxCollections order has been placed successfully.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @media print{
    .site-header, .announce, .mobile-nav, .site-footer, .wa-float, .no-print, #site-header, #site-footer{ display:none !important; }
    body{ background:#fff; }
    .invoice{ border:none; }
  }
</style>
</head>
<body data-nav="">

<div id="site-header" class="no-print"></div>

<main class="section">
  <div class="container" id="successRoot" style="max-width:900px;">
    <!-- populated by script -->
  </div>
</main>

<div id="site-footer" class="no-print"></div>

<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const raw = sessionStorage.getItem('markxLastOrder');
    const root = document.getElementById('successRoot');
    if (!raw) {
      root.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-circle-question"></i>
          <h2>No Recent Order Found</h2>
          <p>Place an order to see your confirmation here.</p>
          <a href="shop.html" class="btn btn-accent">Start Shopping</a>
        </div>`;
      return;
    }
    const order = JSON.parse(raw);
    const paymentLabel = order.paymentMethod === 'card' ? 'Card Payment (15% discount applied)' : 'Cash on Delivery';
    const dateStr = new Date(order.date).toLocaleDateString('en-PK', { year:'numeric', month:'long', day:'numeric' });

    root.innerHTML = `
      <div class="no-print" style="text-align:center;margin-bottom:36px;">
        <i class="fa-solid fa-circle-check" style="font-size:3rem;color:var(--accent);"></i>
        <h1 style="font-size:2.1rem;margin-top:16px;">Order Placed Successfully</h1>
        <p class="lede" style="margin:10px auto 22px;">Thank you for shopping with MarkxCollections.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn-solid" id="printInvoiceBtn">Download / Print Invoice</button>
          <a href="shop.html" class="btn btn-ghost">Continue Shopping</a>
        </div>
      </div>

      <div class="invoice" id="invoiceBox">
        <div class="invoice-head">
          <div>
            <div class="logo">Markx<span style="color:var(--accent);">Collections</span></div>
            <p style="font-size:.85rem;color:#57523f;margin-top:4px;">Wear It. Print It. Make It Yours.</p>
          </div>
          <div style="text-align:right;font-size:.88rem;">
            <div><strong>Invoice / Order #</strong> ${order.orderNumber}</div>
            <div>Date: ${dateStr}</div>
          </div>
        </div>

        <div class="form-grid" style="margin-bottom:20px;">
          <div>
            <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#77715f;margin-bottom:8px;">Customer</h4>
            <p style="font-size:.92rem;">${order.customer.name}<br>${order.customer.phone}<br>${order.customer.address}, ${order.customer.city} ${order.customer.postalCode || ''}</p>
          </div>
          <div>
            <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#77715f;margin-bottom:8px;">Payment</h4>
            <p style="font-size:.92rem;">${paymentLabel}</p>
          </div>
        </div>

        <table>
          <thead><tr><th>Product</th><th>Size</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
          <tbody>
            ${order.items.map(i => `<tr><td>${i.name} (${i.color})</td><td>${i.size}</td><td>${i.qty}</td><td>${formatMoney(i.price)}</td><td>${formatMoney(i.price * i.qty)}</td></tr>`).join('')}
          </tbody>
        </table>

        <div style="max-width:280px;margin-left:auto;">
          <div class="sum-row"><span>Subtotal</span><span>${formatMoney(order.subtotal)}</span></div>
          ${order.discount > 0 ? `<div class="sum-row discount"><span>Card Discount</span><span>-${formatMoney(order.discount)}</span></div>` : ''}
          <div class="sum-row"><span>Delivery</span><span>${order.delivery === 0 ? 'FREE' : formatMoney(order.delivery)}</span></div>
          <div class="sum-row total"><span>Total</span><span>${formatMoney(order.total)}</span></div>
        </div>

        <p style="text-align:center;margin-top:30px;font-size:.85rem;color:#77715f;">Thank you for shopping with MarkxCollections.</p>
      </div>
    `;

    document.getElementById('printInvoiceBtn').addEventListener('click', () => window.print());
  });
</script>
</body>
</html>
